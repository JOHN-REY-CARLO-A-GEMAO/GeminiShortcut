<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Prompts Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>Student Prompts</h1>
        
        <div class="input-group">
            <input type="text" id="promptName" placeholder="Name (e.g., Explain Simply)">
            <textarea id="promptText" rows="3" placeholder="Prompt (e.g., Explain this for a high-school student: )"></textarea>
            <button id="addPrompt">Add Action</button>
        </div>

        <div class="settings-group">
            <h2>Quick Settings</h2>
            <label class="setting-row">
                <input type="checkbox" id="floatingEnabled">
                <span>Show floating button on text selection</span>
            </label>
            <label class="setting-row">
                <span>Floating button action</span>
                <select id="floatingAction"></select>
            </label>
            <button id="resetDefaults" class="secondary">Reset Student Defaults</button>
        </div>

        <ul id="promptList">
            <!-- Items will be injected here via popup.js -->
        </ul>
        
        <div class="footer">
            <small>Right-click text to use these!</small>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
